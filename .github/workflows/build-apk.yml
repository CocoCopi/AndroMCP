name: Build APK

# Builds installable debug APKs in the cloud and attaches them as downloadable artifacts.
#
# Why this exists alongside edge-release.yml: edge-release.yml hard-fails without the four
# RELEASE_KEYSTORE_* repository secrets (it signs release APKs), so on a fresh fork you cannot get
# an APK out of it. Debug builds are signed with the standard Android debug key, so this workflow
# needs NO secrets at all and works immediately on a new repository.
#
# Download the result from the run's "Artifacts" section, or from the Summary page.
#
# The native dependencies (cloudflared + ngrok-java) are compiled exactly as edge-release.yml does,
# because app/build.gradle.kts has a file dependency on vendor/ngrok-java/**/target/*.jar and the
# submodules ship empty — without these steps the Kotlin compile step fails on every com.ngrok
# reference.

on:
  push:
    branches:
      - main
  # Lets you start a build by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history + tags: app/build.gradle.kts derives versionName/versionCode from git and
          # fails configuration without them (there is no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ── Native dependencies (cached by submodule content, same keys as edge-release.yml) ──
      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Set up Go
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.6'

      - name: Set up Rust
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Compile cloudflared for Android
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      # ── Geolocation DB toolchain: generated at build time from DB-IP City Lite ──
      - name: Set up Python (geolocation DB generator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache DB-IP source CSV
        uses: actions/cache@v6
        with:
          path: .dbip-cache
          key: dbip-csv-${{ runner.os }}-${{ hashFiles('scripts/location-db/build_location_db.py') }}

      # ── Build ──
      # Debug only: these are signed with the auto-generated debug key, so no secrets are needed.
      # -x lint/test is not used — the build must fail loudly if the code does not compile.
      - name: Build debug APKs
        run: ./gradlew assembleGmsDebug assembleFossDebug

      - name: List built APKs
        run: |
          echo "### Built APKs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: andromcp-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 30
